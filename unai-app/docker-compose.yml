# =============================================================================
# UNAI + Vector Store — one-command deploy stack
# -----------------------------------------------------------------------------
# UNAI ships a vector store OUT OF THE BOX. This stack bundles Qdrant (the
# product default) alongside the UNAI app and seeds the Agentic-RAG knowledge
# base automatically, so retrieval works the moment the stack is up.
#
#   docker compose up --build
#   → UNAI app:   http://localhost:8080
#   → Qdrant:     http://localhost:6333  (dashboard: /dashboard)
#
# To use a different backend instead of Qdrant (Chroma, Weaviate, Pinecone,
# pgvector, Databricks, Azure), set UNAI_VECTOR_* in a .env file (see
# .env.example) and point UNAI_VECTOR_URL at it — the app's connectors take
# over and this Qdrant service can be removed. If the store is ever
# unreachable, UNAI automatically falls back to its built-in embedded index.
# =============================================================================
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the collection and loads the KB, then exits.
  vector-init:
    build: .
    command: ["node", "vector_seed.js"]
    environment:
      UNAI_VECTOR_PROVIDER: "${UNAI_VECTOR_PROVIDER:-qdrant}"
      UNAI_VECTOR_URL: "${UNAI_VECTOR_URL:-http://qdrant:6333}"
      UNAI_VECTOR_COLLECTION: "${UNAI_VECTOR_COLLECTION:-unai_kb}"
      UNAI_VECTOR_API_KEY: "${UNAI_VECTOR_API_KEY:-}"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  unai:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      # --- Vector store: default is Qdrant, wired to the service above ---
      UNAI_VECTOR_PROVIDER: "${UNAI_VECTOR_PROVIDER:-qdrant}"
      UNAI_VECTOR_URL: "${UNAI_VECTOR_URL:-http://qdrant:6333}"
      UNAI_VECTOR_COLLECTION: "${UNAI_VECTOR_COLLECTION:-unai_kb}"
      UNAI_VECTOR_API_KEY: "${UNAI_VECTOR_API_KEY:-}"
      # --- Optional: login wall + live model (leave unset for demo defaults) ---
      APP_PASSWORD: "${APP_PASSWORD:-}"
      EXPERT_PASSWORD: "${EXPERT_PASSWORD:-}"
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
